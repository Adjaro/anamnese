extends: default

ignore: |
  .venv/
  data/
  transform/target/
  transform/dbt_packages/
  transform/logs/

rules:
  document-start: disable
  line-length:
    max: 100
    level: warning
  indentation:
    spaces: 2
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  truthy:
    allowed-values: ["true", "false"]
    # La cle `on:` des workflows GitHub n'est pas un booleen.
    check-keys: false
