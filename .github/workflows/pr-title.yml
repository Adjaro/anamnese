# Le titre de PR devient le message du commit squash : meme format que les commits.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            perf
            build
            ci
            revert
          scopes: |
            dbt
            guardrails
            engine
            api
            app
            eval
            docker
            data
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            La description doit commencer par une minuscule et ne pas finir par un point.
      - name: 72 caracteres maximum
        env:
          TITRE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#TITRE}" -gt 72 ]; then
            echo "::error::titre de ${#TITRE} caracteres, 72 maximum"
            exit 1
          fi
